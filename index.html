<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ganesha's Broken Temple</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;600;700;800&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./src/styles/style.css" />
  </head>
  <body>
    <div class="font-preloader" aria-hidden="true">
      <span style="font-family: 'Cinzel Decorative'; font-weight: 700;">Ganesha</span>
      <span style="font-family: 'Cinzel'; font-weight: 700;">Ganesha</span>
      <span style="font-family: 'Outfit'; font-weight: 600;">Ganesha</span>
    </div>
    <div id="game-wrapper">
      <header id="game-header">
        <h1>Ganesha's Broken Temple</h1>
      </header>
      <div id="game-container"></div>
      <footer id="game-footer">
        <div class="controls-guide">
          <span><kbd>A</kbd> / <kbd>D</kbd> or <kbd>◄</kbd> <kbd>►</kbd> Move</span>
          <span><kbd>W</kbd> / <kbd>Space</kbd> / <kbd>▲</kbd> Jump</span>

          <span><kbd>R</kbd> Restart Level</span>

      </footer>
    </div>
    <script type="module" src="./src/main.js"></script>
